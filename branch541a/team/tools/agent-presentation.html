function Presentation(){
  const [idx,setIdx]=useState(0);
  const [lang,setLang]=useState("es");
  const slide=SLIDES[idx];
  const total=SLIDES.length;
  const nav=(dir)=>setIdx(i=>Math.max(0,Math.min(total-1,i+dir)));

  return(
    <div style={{fontFamily:"'DM Sans',system-ui,sans-serif",background:NAVY,minHeight:"100vh",display:"flex",flexDirection:"column",color:WHITE}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@700;800&display=swap');*{box-sizing:border-box;margin:0;padding:0;}@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.fi{animation:fi 0.3s ease;}.nav-btn{transition:all .15s;cursor:pointer;border:none;}.nav-btn:hover{opacity:.8;transform:scale(1.05);}.pill{transition:all .15s;cursor:pointer;border:none;}.pill:hover{opacity:.85;}::-webkit-scrollbar{display:none;}`}</style>

      <div style={{background:CARD,borderBottom:`1px solid ${BORDER}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,color:GOLD}}>DEL VALLE LENDING CO. · BARRETT</div>
          <div style={{fontSize:10,color:DIM}}>AGENT PARTNERSHIP PRESENTATION</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {["es","en"].map(l=>(
            <button key={l} className="pill" onClick={()=>setLang(l)}
              style={{background:lang===l?GOLD:BORDER,color:lang===l?NAVY:DIM,borderRadius:4,padding:"4px 10px",fontSize:10,fontWeight:600}}>
              {l.toUpperCase()}
            </button>
          ))}
          <div style={{fontSize:11,color:DIM,marginLeft:10}}>{idx+1} / {total}</div>
        </div>
      </div>

      <div style={{flex:1,display:"flex",alignItems:"stretch",minHeight:0}}>
        <div style={{display:"flex",alignItems:"center",padding:"0 6px"}}>
          <button className="nav-btn" onClick={()=>nav(-1)} disabled={idx===0}
            style={{background:idx===0?"transparent":BORDER,color:idx===0?BORDER:WHITE,borderRadius:8,padding:"10px 8px",fontSize:18,opacity:idx===0?0.2:1}}>‹</button>
        </div>
        <div style={{flex:1,padding:"16px",display:"flex",alignItems:"center",justifyContent:"center",overflow:"auto"}}>
          <div className="fi" key={idx} style={{width:"100%",maxWidth:860}}>
            <SlideRenderer slide={slide} lang={lang}/>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",padding:"0 6px"}}>
          <button className="nav-btn" onClick={()=>nav(1)} disabled={idx===total-1}
            style={{background:idx===total-1?"transparent":GOLD,color:idx===total-1?BORDER:NAVY,borderRadius:8,padding:"10px 8px",fontSize:18,opacity:idx===total-1?0.2:1}}>›</button>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"center",gap:6,padding:"10px 0",background:CARD,borderTop:`1px solid ${BORDER}`,flexWrap:"wrap"}}>
        {SLIDES.map((_,i)=>(
          <div key={i} onClick={()=>setIdx(i)} style={{width:i===idx?20:7,height:7,borderRadius:4,background:i===idx?GOLD:BORDER,cursor:"pointer",transition:"all .2s"}}/>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Presentation/>);
</script>
